<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BCM Question 4 — Grid layout</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="grid" aria-label="Layout demo blocks A through H">
    <section class="cell cell-a">
      <h2>A — This is an intentionally long heading to verify wrapping and overflow behaviour in the grid cell</h2>
    </section>
    <section class="cell cell-b"><h2>B</h2></section>
    <section class="cell cell-c"><h2>C</h2></section>
    <section class="cell cell-d"><h2>D</h2></section>
    <section class="cell cell-e"><h2>E</h2></section>
    <section class="cell cell-f"><h2>F</h2></section>
    <section class="cell cell-g"><h2>G</h2></section>
    <section class="cell cell-h"><h2>H</h2></section>
  </div>
</body>
</html>
